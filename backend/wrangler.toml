# Two configurations live in this file.
#
#   top level      — local development. `wrangler dev` and the vitest pool read it.
#   [env.production] — what actually gets deployed. Always deploy with
#                      `wrangler deploy --env production`.
#
# The split exists because this Worker is deployed from git. Cloudflare Workers Builds
# runs a deploy command on every push to main, and a bare `wrangler deploy` would ship
# PLATFORM_HOSTNAME = "localhost:8787" to production — where it matches no row in
# `domains`, so every redirect 404s. Making the production values a separate block means
# that mistake is not one command away.

name = "qrly"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Non-secret vars. Secrets go in .dev.vars locally and `wrangler secret put` in prod.
[vars]
ENVIRONMENT = "development"
PLATFORM_HOSTNAME = "localhost:8787"
DASHBOARD_ORIGIN = "http://localhost:3000"

# Slug resolution cache. `id` is only used for remote deploys; local dev uses Miniflare.
[[kv_namespaces]]
binding = "LINKS_KV"
id = "0000000000000000000000000000000f"
preview_id = "0000000000000000000000000000000f"

[triggers]
crons = ["0 0 * * *", "15 3 * * 1"]

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Production. Every key is repeated rather than inherited: vars and bindings are
# non-inheritable in Wrangler anyway, and spelling out the rest means what deploys
# is readable in one block instead of assembled from two.
#
# `name` is "qrly-backend" to match the Workers Builds project. A mismatch is not
# fatal — CI overrides it and warns — but a config that disagrees with what it
# deploys to is a lie waiting to confuse someone. It pairs with "qrly-dashboard".
# ---------------------------------------------------------------------------
[env.production]
name = "qrly-backend"
workers_dev = true

# One route, deliberately. "*/*" matches every hostname entering the zone, which
# is what makes custom domains work: a customer CNAMEs qr.theirbrand.com at us,
# Cloudflare for SaaS terminates TLS for it, and the request arrives inside this
# zone where this route picks it up. A per-hostname route would mean a deploy per
# customer. See developers.cloudflare.com → Cloudflare for SaaS → Worker as origin.
#
# It is also the ONLY route on this zone. The dashboard has no route of its own: it
# is served from qrly.lol alongside short codes, reached through the service binding
# below rather than through DNS. One hostname, one canonical origin.
[[env.production.routes]]
pattern = "*/*"
zone_name = "qrly.lol"

[env.production.vars]
ENVIRONMENT = "production"
# The hostname this Worker serves and the default domain for every new link.
# A matching row must exist in `domains` — added by migration 0008.
PLATFORM_HOSTNAME = "qrly.lol"
# CORS allow-list for /api/*. The dashboard is now same-origin with the API, so in
# production this never actually gets exercised by the app itself — it stays as the
# allow-list that keeps a hostile page from making authenticated writes.
DASHBOARD_ORIGIN = "https://qrly.lol"

# The dashboard Worker, reached in-process. Same thread, same server: no network
# hop, no DNS, no second request charge. This is what lets qrly.lol/links and
# qrly.lol/aB3xK9p be the same hostname without the dashboard sitting in front of
# the redirect hot path.
[[env.production.services]]
binding = "DASHBOARD"
service = "qrly-dashboard"

# Created 2026-08-29 as "qrly-links".
[[env.production.kv_namespaces]]
binding = "LINKS_KV"
id = "118e5de915994da58a00e0915b485b61"

# Daily: Supabase keep-alive (a free project pauses after 7 days idle) and the retention
# purge. Weekly: the Safe Browsing re-check.
[env.production.triggers]
crons = ["0 0 * * *", "15 3 * * 1"]

[env.production.observability]
enabled = true
